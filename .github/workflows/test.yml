name: Test
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-lint:
    name: runner / sqlfluff (github-check)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlfluff:
          - "4.1.0"
        extra_requirements_txt: ${{ fromJSON(github.event.action == 'synchronize' && '["testdata/test_failed_dbt/extra_requirements-1.9.txt"]' || '["testdata/test_failed_dbt/extra_requirements-1.8.txt","testdata/test_failed_dbt/extra_requirements-1.9.txt"]') }}
        config:
          - .sqlfluff.bigquery
          - .sqlfluff.postgres
          - .sqlfluff.redshift
          - .sqlfluff.snowflake
          - .sqlfluff.spark
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: lint-sql
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          sqlfluff_version: ${{ matrix.sqlfluff }}
          sqlfluff_command: lint
          templater: jinja
          working-directory: "${{ github.workspace }}/testdata/test_failed_dbt"
          config: "${{ github.workspace }}/testdata/test_failed_dbt/${{ matrix.config }}"
          paths: "${{ github.workspace }}/testdata/test_failed_dbt/models"
          extra_requirements_txt: "${{ github.workspace }}/${{ matrix.extra_requirements_txt }}"
      - name: check the exit code
        if: ${{ !success() }}
        run: echo 'The previous step should fail' && exit 1
      - name: Test outputs
        if: always()
        shell: bash
        run: |
          echo '${{ steps.lint-sql.outputs.sqlfluff-results }}' | jq -r '.'
          echo '${{ steps.lint-sql.outputs.sqlfluff-results-rdjson }}' | jq -r '.'
          echo '${{ steps.lint-sql.outputs.sqlfluff-exit-code }}'
          echo '${{ steps.lint-sql.outputs.reviewdog-exit-code }}'

  test-fix:
    needs: ["test-lint"]
    name: runner / sqlfluff (test-fix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlfluff: ${{ fromJSON(github.event.action == 'synchronize' && '["4.1.0"]' || '["3.2.5","4.1.0"]') }}
        extra_requirements_txt: ${{ fromJSON(github.event.action == 'synchronize' && '["testdata/test_failed_dbt/extra_requirements-1.9.txt"]' || '["testdata/test_failed_dbt/extra_requirements-1.8.txt","testdata/test_failed_dbt/extra_requirements-1.9.txt"]') }}
        config:
          - .sqlfluff.bigquery
          - .sqlfluff.postgres
          - .sqlfluff.redshift
          - .sqlfluff.snowflake
          - .sqlfluff.spark
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: lint-sql
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          sqlfluff_version: ${{ matrix.sqlfluff }}
          sqlfluff_command: fix
          templater: jinja
          working-directory: "${{ github.workspace }}/testdata/test_failed_dbt"
          config: "${{ github.workspace }}/testdata/test_failed_dbt/${{ matrix.config }}"
          paths: "${{ github.workspace }}/testdata/test_failed_dbt/models"
          extra_requirements_txt: "${{ github.workspace }}/${{ matrix.extra_requirements_txt }}"
